<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Access Code - Che Che Bakeshop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <style>
      .change-code-form { display: grid; gap: 16px; }
      .change-code-form .input-group { margin-bottom: 0; }
      .change-code-form .input-large { box-sizing: border-box; }
      .change-code-error { color: #dc2626; }
      .change-code-success { color: #16a34a; }
      .change-code-link { display: inline-block; margin-top: 18px; color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <div class="login-card">
        <div class="login-content">
          <div style="text-align: center; margin-bottom: 2rem;">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Che Che Bakeshop Logo" style="width: 120px; height: 120px; border-radius: 12px; margin-bottom: 1rem;" />
          </div>
          <h1 class="login-title">Change access code</h1>
          <p class="login-subtitle">Update the code used to access the bakery system.</p>
          <div class="card">
            {% if error %}
            <div class="alert change-code-error" role="alert">{{ error }}</div>
            {% endif %}
            {% if success %}
            <div class="alert change-code-success" role="status">{{ success }}</div>
            {% endif %}
            <form method="post" class="change-code-form">
              <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
              <div class="input-group">
                <label class="input-label" for="current-code">Current code</label>
                <input id="current-code" name="current_code" type="password" class="input input-large" required autocomplete="current-password" />
              </div>
              <div class="input-group">
                <label class="input-label" for="new-code">New code</label>
                <input id="new-code" name="new_code" type="password" class="input input-large" required minlength="6" autocomplete="new-password" />
              </div>
              <div class="input-group">
                <label class="input-label" for="confirm-code">Confirm new code</label>
                <input id="confirm-code" name="confirm_code" type="password" class="input input-large" required minlength="6" autocomplete="new-password" />
              </div>
              <button type="submit" class="button button-primary button-full">Save access code</button>
            </form>
            <a class="change-code-link" href="{{ url_for('login') }}">Back to login</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
